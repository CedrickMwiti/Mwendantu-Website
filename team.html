    <div class="container">
      <div class="grid cols-4">

        <button class="team-card reveal" data-team-card data-name="Cedrick Mwiti" data-role="Station Manager" data-bio="Cedrick leads Mwendantu Media's day-to-day operations, overseeing both the TV and 99.5 FM teams. He has spent over a decade in Kenyan broadcast media and is passionate about growing local journalism in Tharaka-Nithi.">

          <div class="team-info"><h3>Cedrick Mwiti</h3><div class="role">Station Manager</div></div>
        </button>

        <button class="team-card reveal" data-team-card data-name="Racious Murimi" data-role="Head of News" data-bio="Murimi heads the newsroom, coordinating coverage of county government, business and community affairs across Tharaka-Nithi. She anchors the Tharaka-Nithi Evening News bulletin.">
          <div class="team-photo"></div>
          <div class="team-info"><h3>Racious Murimi</h3><div class="role">Head of News</div></div>
        </button>

        <button class="team-card reveal" data-team-card data-name="Mary Murugi" data-role="Breakfast Show Host" data-bio="Murugi wakes up Chuka every morning on the Breakfast Drive, mixing music, traffic and community updates to start the day. Listeners know him for his easy humour and love of local music.">
          <div class="team-photo"></div>
          <div class="team-info"><h3>Mary Murugi</h3><div class="role">Breakfast Show Host</div></div>
        </button>

        <button class="team-card reveal" data-team-card data-name="Gracious Makena" data-role="TV Producer" data-bio="Gracious produces Mwendantu TV's flagship programs, from the evening news to the Riiri Wetu Magazine show, bringing Tharaka-Nithi's stories to screen every week.">

          <div class="team-info"><h3>Gracious Makena</h3><div class="role">TV Producer</div></div>
        </button>

        <button class="team-card reveal" data-team-card data-name="Lewis Mwiti" data-role="Sports Presenter" data-bio="Mwiti covers local football, athletics and school sports for both TV and radio, and hosts the weekly Sports Roundup.">
          <div class="team-photo"></div>
          <div class="team-info"><h3>Lewis Mwiti</h3><div class="role">Sports Presenter</div></div>
        </button>

        <button class="team-card reveal" data-team-card data-name="Alexander Mbuba" data-role="Evening Drive Host" data-bio="Mbuba hosts the Afternoon Drive on 99.5 FM, keeping commuters company with music, weather and community shout-outs.">

          <div class="team-info"><h3>Alexander Mbuba</h3><div class="role">Evening Drive Host</div></div>
        </button>

          <div class="team-info"><h3>Dickens Mugambi</h3><div class="role">Technical Director</div></div>
        </button>

        <button class="team-card reveal" data-team-card data-name="Eddy Kagendo" data-role="Community &amp; Talk Host" data-bio="Kagendo hosts Riiri Wetu Talk, the station's flagship call-in show covering community issues, health and social affairs.">
